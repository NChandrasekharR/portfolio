    <script>
        // Hamburger menu toggle
        const hamburger = document.querySelector('.hamburger');
        const navMenu = document.querySelector('.nav-menu');

        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            navMenu.classList.toggle('active');
        });

        // Close menu when clicking on a link
        document.querySelectorAll('.nav-menu a').forEach(link => {
            link.addEventListener('click', () => {
                hamburger.classList.remove('active');
                navMenu.classList.remove('active');
            });
        });

        // Preload images to prevent flicker
        const images = ['images/profile.png', 'images/profile-smile.png', 'images/profile-github.png', 'images/profile-instagram.png'];
        images.forEach(src => {
            const img = new Image();
            img.src = src;
        });

        // Get the profile image element
        const profileImage = document.getElementById('profileImage');

        // Get the GitHub link
        const githubLink = document.querySelector('a[aria-label="GitHub"]');

        // Get the Instagram link
        const instagramLink = document.querySelector('a[aria-label="Instagram"]');

        // Get all other links on the page (excluding GitHub and Instagram)
        const otherLinks = document.querySelectorAll('a:not([aria-label="GitHub"]):not([aria-label="Instagram"])');

        // Add hover event listener for GitHub link
        if (githubLink) {
            githubLink.addEventListener('mouseenter', () => {
                profileImage.src = 'images/profile-github.png';
            });

            githubLink.addEventListener('mouseleave', () => {
                profileImage.src = 'images/profile.png';
            });
        }

        // Add hover event listener for Instagram link
        if (instagramLink) {
            instagramLink.addEventListener('mouseenter', () => {
                profileImage.src = 'images/profile-instagram.png';
            });

            instagramLink.addEventListener('mouseleave', () => {
                profileImage.src = 'images/profile.png';
            });
        }

        // Add hover event listeners to all other links
        otherLinks.forEach(link => {
            link.addEventListener('mouseenter', () => {
                profileImage.src = 'images/profile-smile.png';
            });

            link.addEventListener('mouseleave', () => {
                profileImage.src = 'images/profile.png';
            });
        });
    </script>
